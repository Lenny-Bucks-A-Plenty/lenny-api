[project]
name = "lenny-api"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
  { name = "Charles Buffington, Parker Buszka, Andrew Jandernoa" }
]
dependencies = [
  "fastapi>=0.111.0,<0.112.0",
  "sqlmodel>=0.0.16,<0.0.17",
  "pandas>=2.2.2,<3.0.0",
  "lxml>=5.2.2,<6.0.0",
  "yfinance>=0.2.38,<0.3.0",
  "fastapi-restful==0.5.0",
  "typing-inspect>=0.9.0,<0.10.0",
  "matplotlib>=3.9.0,<4.0.0",
  "scikit-learn>=1.5.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.4,<7.0.0"
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
